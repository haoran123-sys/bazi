name: update-site
on:
  push:
    branches: [ gh-pages ]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Fetch and verify
        run: |
          curl -fsSL -o /tmp/new.html "https://aka.doubaocdn.com/s/pVYbh9rUcM"
          md5sum /tmp/new.html
          echo "c0ddcdef43af412ebd820827b4d9ad99  /tmp/new.html" | md5sum -c -
          cp /tmp/new.html ./index.html
      - name: Commit and push
        run: |
          git config user.name "haoran123-sys"
          git config user.email "haoran123-sys@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no change"; else git commit -m "feat: label first and current dayun on wheel"; git push origin HEAD:gh-pages; fi
