name: update-site
on:
  push:
    branches: [ gh-pages ]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Fetch and verify
        run: |
          curl -fsSL -o /tmp/new.html "https://aka.doubaocdn.com/s/Gd13QkFe8p"
          md5sum /tmp/new.html
          echo "fed32c906a3a8e4f3ee63e08182c808d  /tmp/new.html" | md5sum -c -
          cp /tmp/new.html ./index.html
      - name: Commit and push
        run: |
          git config user.name "haoran123-sys"
          git config user.email "haoran123-sys@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no change"; else git commit -m "fix: lunar month label off-by-one causing whole-month shift"; git push origin HEAD:gh-pages; fi
